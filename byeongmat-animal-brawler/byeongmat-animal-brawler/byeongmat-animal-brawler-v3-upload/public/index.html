<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>병맛 동물 격투게임</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <section id="homePanel" class="panel home-panel">
      <div class="eyebrow">v6 · 원래 캐릭터 복귀 · 자연스러운 격투 모션</div>
      <h1>병맛 동물 격투게임</h1>
      <p class="subtitle">찌개 · 감자 · 만두 · 구찌의 원래 귀여운 도트 스타일로 싸우는 장판 난투.</p>

      <label class="field-label" for="nickname">닉네임</label>
      <input id="nickname" class="text-input" maxlength="12" placeholder="예: 종호" autocomplete="off" />

      <div class="section-label">캐릭터 선택</div>
      <div id="characterGrid" class="character-grid" aria-label="캐릭터 선택">
        <button class="character-card selected" data-character="zzigae" type="button">
          <canvas width="96" height="96" aria-hidden="true"></canvas>
          <div class="char-copy"><strong>찌개</strong><span>갈색 말티푸 · 덥수룩한 귀 · 묵직한 균형형</span></div>
        </button>
        <button class="character-card" data-character="gamja" type="button">
          <canvas width="96" height="96" aria-hidden="true"></canvas>
          <div class="char-copy"><strong>감자</strong><span>2개월 크림 토이푸들 · 아주 작고 빠른 꼬마</span></div>
        </button>
        <button class="character-card" data-character="mandu" type="button">
          <canvas width="96" height="96" aria-hidden="true"></canvas>
          <div class="char-copy"><strong>만두</strong><span>하얀 푸들 · 동글동글한 퍼프털 · 점프 특화</span></div>
        </button>
        <button class="character-card" data-character="gucci" type="button">
          <canvas width="96" height="96" aria-hidden="true"></canvas>
          <div class="char-copy"><strong>구찌</strong><span>주황+하양 코숏 · 길쭉한 꼬리 · 날렵한 난투형</span></div>
        </button>
      </div>

      <button id="createRoom" class="primary-button" type="button">방 만들기</button>
      <div class="join-row">
        <input id="roomCode" class="text-input room-code" maxlength="4" placeholder="방 코드" autocomplete="off" />
        <button id="joinRoom" class="secondary-button" type="button">입장</button>
      </div>
      <p id="homeMessage" class="message" role="status"></p>
    </section>

    <section id="lobbyPanel" class="panel lobby-panel hidden">
      <div class="lobby-head">
        <div>
          <div class="eyebrow">대기실</div>
          <h2>방 코드 <span id="lobbyCode">----</span></h2>
        </div>
        <button id="copyInvite" class="secondary-button compact" type="button">초대 링크 복사</button>
      </div>

      <div class="section-label">맵 선택</div>
      <div id="mapGrid" class="map-grid">
        <button class="map-card selected" data-map="living" type="button"><span class="map-thumb living-thumb"></span><strong>집안 거실</strong><small>간단한 도트 거실 · 중앙 러그에서 난투</small></button>
        <button class="map-card" data-map="bathroom" type="button"><span class="map-thumb bathroom-thumb"></span><strong>화장실</strong><small>차가운 타일 위의 살벌한 몸싸움</small></button>
        <button class="map-card" data-map="walkway" type="button"><span class="map-thumb walkway-thumb"></span><strong>아파트 산책로</strong><small>긴 산책길에서 밀치고 날리기</small></button>
      </div>

      <div class="section-label">참가자</div>
      <div id="playerList" class="player-list"></div>
      <div class="lobby-actions">
        <button id="addBot" class="secondary-button" type="button">연습용 봇 추가</button>
        <button id="startGame" class="primary-button" type="button">난투 시작</button>
      </div>
      <p id="lobbyMessage" class="message" role="status"></p>
    </section>

    <section id="gamePanel" class="game-panel hidden">
      <div class="game-shell">
        <canvas id="gameCanvas" width="768" height="480" tabindex="0" aria-label="병맛 동물 격투게임 플레이 화면"></canvas>
        <div id="scoreBar" class="score-bar"></div>
        <div id="itemLegend" class="item-legend"><span>🔨 망치 3번</span><span>🍖 피해 -55%</span><span>⭐ 6초 무적</span></div>
        <div id="localHud" class="local-hud">
          <span id="localName">-</span>
          <strong id="localDamage">0%</strong>
          <em id="localItem"></em>
        </div>
        <div class="controls-hint">WASD 이동 · J 주먹/망치 · K 발차기 · L 박치기 · Space 점프 · Shift 대시</div>
        <div id="centerBanner" class="center-banner hidden"></div>
      </div>

      <div id="touchControls" class="touch-controls" aria-label="모바일 조작">
        <div class="dpad">
          <button data-touch="up" type="button">▲</button>
          <button data-touch="left" type="button">◀</button>
          <button data-touch="down" type="button">▼</button>
          <button data-touch="right" type="button">▶</button>
        </div>
        <div class="action-pad">
          <button data-action="punch" type="button">주먹</button>
          <button data-action="kick" type="button">발차기</button>
          <button data-action="headbutt" type="button">박치기</button>
          <button data-action="jump" type="button">점프</button>
          <button data-action="dash" type="button">대시</button>
        </div>
      </div>
    </section>

    <section id="resultPanel" class="panel result-panel hidden">
      <div class="eyebrow">난투 종료</div>
      <h2 id="winnerText">승자!</h2>
      <div id="resultScores" class="result-scores"></div>
      <button id="rematchButton" class="primary-button" type="button">한 판 더</button>
      <p class="message">방장만 다시 시작할 수 있어요.</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
