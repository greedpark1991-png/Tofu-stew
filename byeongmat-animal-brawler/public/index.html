<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#151820" />
  <title>병맛 동물 격투게임</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <section id="menu" class="panel center-panel">
      <div class="logo">병맛 동물 격투게임</div>
      <p class="subtitle">친구 링크 초대 · 2~4인 · 3인칭 넉백 난투</p>
      <label>닉네임<input id="name" maxlength="12" placeholder="예: 종호" /></label>
      <div class="chars" id="menuChars"></div>
      <div class="menu-actions">
        <button id="createBtn" class="primary">방 만들기</button>
        <div class="join-row"><input id="roomCode" maxlength="4" placeholder="방 코드" /><button id="joinBtn">입장</button></div>
      </div>
      <div id="menuMsg" class="msg"></div>
    </section>

    <section id="lobby" class="panel center-panel hidden">
      <div class="lobby-head"><div><b>대기실</b><span id="roomLabel"></span></div><button id="copyBtn">초대 링크 복사</button></div>
      <div id="playerList" class="player-list"></div>
      <div class="chars small" id="lobbyChars"></div>
      <div class="skill-note" id="skillNote"></div>
      <button id="startBtn" class="primary">게임 시작</button>
      <div class="hint">호스트가 시작합니다 · 최소 2명</div>
    </section>

    <div id="hud" class="hidden">
      <div id="scoreboard" class="scoreboard"></div>
      <div id="damage" class="damage">0%</div>
      <div class="cooldowns"><span id="dashCd">SHIFT 대시</span><span id="skillCd">E 스킬</span></div>
      <div class="controls">WASD 이동 · 마우스 시점 · 클릭 공격 · SPACE 점프 · SHIFT 대시 · E 특수기</div>
      <div id="lockHint" class="lock-hint">화면을 클릭하면 마우스 시점 조작</div>
    </div>

    <section id="gameOver" class="panel center-panel hidden">
      <div class="logo small-logo">경기 종료!</div>
      <div id="winnerText" class="winner"></div>
      <div id="finalScores" class="final-scores"></div>
      <button id="rematchBtn" class="primary">재대결</button>
      <div class="hint">호스트만 재대결을 시작할 수 있습니다.</div>
    </section>

    <div id="toast" aria-live="polite"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/game.js"></script>
</body>
</html>
